<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · JTFC Scoreboard</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Outlined" rel="stylesheet">
<style>body{font-family:Roboto,sans-serif}.ms{font-family:'Material Symbols Outlined';font-size:22px;line-height:1}.card{background:#fff;border-radius:20px;box-shadow:0 1px 3px rgba(30,50,120,.12),0 4px 12px rgba(30,50,120,.06)}
.f{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:.6rem .75rem;outline:none}.f:focus{border-color:#1d5bff;box-shadow:0 0 0 2px #c7d7ff}label{font-size:.75rem;color:#64748b;font-weight:500}
.btn{background:#1d5bff;color:#fff;border-radius:12px;padding:.65rem 1.4rem;font-weight:500;box-shadow:0 2px 6px rgba(29,91,255,.4)}</style></head>
<body class="bg-[#e8eefc] min-h-screen text-slate-800">
<div id="login" class="min-h-screen grid place-items-center p-4 hidden">
  <form onsubmit="return login(event)" class="card p-8 w-full max-w-sm space-y-4">
    <div class="text-center"><span class="ms !text-5xl text-[#0b1b5e]">lock</span><h1 class="text-xl font-bold text-[#0b1b5e]">Admin Login</h1></div>
    <div><label>Password</label><input id="pw" type="password" class="f" required autofocus></div>
    <p id="lerr" class="text-red-600 text-sm"></p>
    <button class="btn w-full">Sign in</button><a href="/" class="block text-center text-sm text-blue-700">← Back to dashboard</a>
  </form></div>
<div id="app" class="max-w-6xl mx-auto p-4 space-y-5 hidden">
  <header class="flex justify-between items-center bg-[#0b1b5e] text-white rounded-2xl px-5 py-4">
    <h1 class="font-bold text-lg">Data Entry</h1><div class="flex gap-4 text-sm"><a href="/" class="underline">Dashboard</a><button onclick="logout()">Logout</button></div></header>
  <form onsubmit="return add(event)" class="card p-5 grid grid-cols-2 md:grid-cols-4 gap-3">
    <div><label>Date</label><input name="op_date" type="date" class="f" required></div>
    <div><label>Unit / Brigade</label><input name="unit" class="f" placeholder="602nd Bde" required></div>
    <div><label>Area</label><input name="area" class="f" placeholder="Region XII"></div>
    <div><label>Threat Group</label><input name="threat_group" class="f" placeholder="BIFF" required></div>
    <div><label>Surrendered</label><input name="surrendered" type="number" min="0" value="0" class="f"></div>
    <div><label>Killed</label><input name="killed" type="number" min="0" value="0" class="f"></div>
    <div><label>Captured</label><input name="captured" type="number" min="0" value="0" class="f"></div>
    <div><label>Apprehended</label><input name="apprehended" type="number" min="0" value="0" class="f"></div>
    <div><label>Firearms Gained</label><input name="firearms" type="number" min="0" value="0" class="f"></div>
    <div><label>Loose FAs (TOLF)</label><input name="tolf" type="number" min="0" value="0" class="f"></div>
    <div><label>Friendly KIA</label><input name="kia" type="number" min="0" value="0" class="f"></div>
    <div><label>Friendly WIA</label><input name="wia" type="number" min="0" value="0" class="f"></div>
    <div class="col-span-2 md:col-span-4 flex items-center gap-3"><button class="btn">Add encounter</button><span id="msg" class="text-sm"></span></div>
  </form>
  <div class="card p-5 flex items-end gap-3"><div><label>Firearms target (annual)</label><input id="tgt" type="number" min="0" class="f"></div><button onclick="setT()" class="btn">Save target</button></div>
  <div class="card p-5 overflow-x-auto"><h2 class="font-bold mb-2">Recent entries</h2>
    <table class="w-full text-sm"><thead><tr class="text-left border-b"><th class="py-2">Date</th><th>Unit</th><th>Group</th><th>Sur/Kil/Cap/App</th><th>FA</th><th>TOLF</th><th>KIA/WIA</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
<script>
const $=id=>document.getElementById(id), esc=t=>String(t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const api=(p,m='GET',b)=>fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json'},body:b&&JSON.stringify(b)});
async function load(){const r=await api('ops');
  if(r.status===401){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}
  const d=await r.json();$('login').classList.add('hidden');$('app').classList.remove('hidden');$('tgt').value=d.target;
  $('rows').innerHTML=d.rows.map(o=>`<tr class="border-b"><td class="py-2">${o.op_date}</td><td>${esc(o.unit)}</td><td>${esc(o.threat_group)}</td><td>${o.surrendered}/${o.killed}/${o.captured}/${o.apprehended}</td><td>${o.firearms}</td><td>${o.tolf}</td><td>${o.kia}/${o.wia}</td><td><button onclick="del(${o.id})" class="text-red-600"><span class="ms">delete</span></button></td></tr>`).join('')}
async function login(e){e.preventDefault();const r=await api('login','POST',{password:$('pw').value});if(r.ok){$('pw').value='';load()}else{const d=await r.json().catch(()=>({}));$('lerr').textContent=d.error||'Error: '+r.status}return false}
async function logout(){await api('logout','POST');load()}
async function add(e){e.preventDefault();const f=e.target,b=Object.fromEntries(new FormData(f));const r=await api('ops','POST',b);
  $('msg').textContent=r.ok?'Saved ✓':(await r.json()).error;$('msg').className='text-sm '+(r.ok?'text-green-600':'text-red-600');if(r.ok){f.reset();load()}return false}
async function del(id){if(confirm('Delete this entry?')){await api('ops/'+id,'DELETE');load()}}
async function setT(){await api('target','PUT',{target:$('tgt').value});alert('Target saved')}
load();
</script></body></html>
